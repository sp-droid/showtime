<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="darkreader-lock">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{rootFolder}}assets/libraries/bootstrap5.0.2/bootstrap.min.css">
    <link rel="stylesheet" href="{{rootFolder}}assets/libraries/fontawesome6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@9.12.0/styles/atom-one-dark.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.11.1/katex.min.css">
    <script src="https://public.flourish.studio/resources/embed.js"></script>
    <link rel="stylesheet" href="{{rootFolder}}assets/css/style.css?v=20260927-blog-post-1">
    <link rel="stylesheet" href="{{rootFolder}}assets/css/github-markdown-dark.css?v=20260927-blog-post-1">
    <script src="{{rootFolder}}assets/js/common.js?v=20260926" defer></script>
    <title>{{title}} | Blog</title>
    {{favicon}}
</head>
{{googleAnalytics}}
<body>
<div id="HTMLdata" section="blog"></div>
<div class="page-shell blog-post-page {{tocClass}}">
    <div id="HTMLtopbar">{{HTMLtopbar}}</div>
    <main class="blog-post-main">
        <div class="blog-post-grid">
            <header class="blog-post-heading" id="post-top">
                <a class="blog-post-back" href="{{backHref}}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Blog</a>
                <p class="blog-post-eyebrow">{{tag}}</p>
                <h1>{{title}}</h1>
                <div class="blog-post-meta">
                    <time datetime="{{isoDate}}">{{date}}</time>
                    <span class="blog-post-meta__separator" aria-hidden="true"></span>
                    <span>{{readingTime}} min read</span>
                </div>
            </header>
{{desktopToc}}
            <article class="blog-post-article" aria-label="{{title}}">
{{mobileToc}}
                <div class="markdown-body" id="HTMLpost">{{content}}</div>
                <footer class="blog-post-footer">
                    <span class="blog-post-footer__tag">{{tag}}</span>
                    <a href="{{backHref}}">All posts <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
                </footer>
            </article>
        </div>
    </main>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    let figureNumber = 0;
    document.querySelectorAll("#HTMLpost img").forEach(img => {
        if (img.alt === "INLINE" || !img.alt.trim()) return;
        figureNumber += 1;
        const caption = document.createElement("span");
        caption.className = "blog-post-caption";
        caption.textContent = `Figure ${figureNumber}. ${img.alt}`;
        img.insertAdjacentElement("afterend", caption);
    });
});
</script>
</body>
</html>
