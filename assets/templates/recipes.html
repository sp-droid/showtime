<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="darkreader-lock">
    <link rel="stylesheet" href="{{rootFolder}}assets/libraries/bootstrap5.0.2/bootstrap.min.css">
    <link rel="stylesheet" href="{{rootFolder}}assets/libraries/fontawesome6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{rootFolder}}assets/css/style.css?v=20260928-index-rows">
    <script src="{{rootFolder}}assets/js/recipes.js?v=20260928-compact-controls" defer></script>
    <script src="{{rootFolder}}assets/js/common.js?v=20260926" defer></script>
    <title>Recipes · Pablo Arbelo Cabrera</title>
    {{favicon}}
</head>
{{googleAnalytics}}
<body>
<div id="HTMLdata" section="recipes"></div>
<div class="page-shell recipes-page">
    <div id="HTMLtopbar">{{HTMLtopbar}}</div>
    <main class="recipes-main">
        <div class="recipes-hero">
            <img class="recipes-hero__cuisine" id="recipeCuisineWatermark" alt="" aria-hidden="true" hidden>
            <p class="recipes-eyebrow">FROM MY KITCHEN</p>
            <h1>Recipes</h1>
        </div>

        <div class="recipes-controls-row">
            <div class="recipes-toolbar">
                <div class="recipes-search-wrap">
                    <label class="visually-hidden" for="recipeSearch">Search recipes</label>
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="recipeSearch" type="search" placeholder="Search recipes" autocomplete="off">
                </div>
                <button class="recipes-view-toggle" id="recipeViewToggle" type="button" aria-label="Advanced search" title="Advanced search" aria-controls="recipeAdvanced" aria-pressed="false">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
            </div>
            <div class="recipes-categories" role="group" aria-label="Recipe filters">
                <label class="recipes-origin" for="recipeOrigin">
                    <span class="visually-hidden">Filter by origin</span>
                    <select id="recipeOrigin" aria-label="Filter by origin">
                        <option value="">Origin</option>
                    </select>
                    <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </label>
                <button type="button" class="is-active" data-category="" aria-pressed="true">All</button>
                <button type="button" data-category="Main courses" aria-pressed="false">Main courses</button>
                <button type="button" data-category="Desserts" aria-pressed="false">Desserts</button>
                <button type="button" data-category="Drinks" aria-pressed="false">Drinks</button>
                <button type="button" data-category="Other" aria-pressed="false">Other</button>
            </div>
            <p class="recipes-result-count" id="recipeResultCount" role="status" aria-live="polite">Loading entries…</p>
        </div>

        <div id="recipeGallery" class="recipes-gallery"></div>

        <section id="recipeAdvanced" class="recipes-advanced" aria-label="Advanced search" hidden>
            <fieldset class="recipes-advanced-filters">
                <legend>Filter the table</legend>
                <label><input type="checkbox" id="recipeLactoseFree"> Lactose free</label>
                <label><input type="checkbox" id="recipeGlutenFree"> Gluten free</label>
                <label><input type="checkbox" id="recipeVegetarian"> Vegetarian</label>
                <label><input type="checkbox" id="recipeVegan"> Vegan</label>
                <label class="recipes-draft-filter"><input type="checkbox" id="recipeUnfinished"> Unfinished recipes</label>
            </fieldset>

            <div id="recipePreview" class="recipes-preview" aria-label="Selected recipe" hidden>
                <img id="recipePreviewImage" alt="">
                <div class="recipes-preview__body">
                    <div class="recipes-preview__topline">
                        <span id="recipePreviewPosition"></span>
                        <div class="recipes-preview__navigation">
                            <button id="recipePrevious" type="button" aria-label="Previous recipe" title="Previous recipe"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
                            <button id="recipeNext" type="button" aria-label="Next recipe" title="Next recipe"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                        </div>
                    </div>
                    <h2 id="recipePreviewTitle"></h2>
                    <p id="recipePreviewDescription" class="recipes-preview__description"></p>
                    <div id="recipePreviewFacts" class="recipes-preview__facts"></div>
                    <a id="recipePreviewLink" class="recipes-preview__link" href="#">View recipe <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
                </div>
            </div>

            <div class="recipes-table-scroll" role="region" aria-label="Recipe search results" tabindex="0">
                <table class="recipes-table">
                    <thead><tr>
                        <th scope="col"><button type="button" data-sort="name">Recipe <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
                        <th scope="col"><button type="button" data-sort="category">Category <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
                        <th scope="col"><button type="button" data-sort="cuisine">Cuisine <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
                        <th scope="col"><button type="button" data-sort="time">Total time <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
                        <th scope="col"><button type="button" data-sort="difficulty">Difficulty <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
                    </tr></thead>
                    <tbody id="recipeTableBody"></tbody>
                </table>
            </div>
        </section>

        <p id="recipeEmpty" class="recipes-empty" hidden>No recipes match your filters. Try another name, origin, or category.</p>
    </main>
</div>
</body>
</html>
